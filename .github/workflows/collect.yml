name: Recolector diario

on:
  schedule:
    - cron: "17 5 * * *"   # 06:17 / 07:17 hora de Madrid, tras la actualización nocturna de precios
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Descargar datos públicos de Biwenger
        run: |
          for score in 1 2 3 5 6 7 8; do
            python collector/collect.py --competition la-liga --score "$score"
          done
      - name: Generar datos de la web
        run: python collector/build_site_data.py --competition la-liga
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw web/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: $(date -u +%F)"
            git push
          fi
